aid: partnerize
name: Partnerize
description: Partnerize is a partnership-automation platform for affiliate, influencer
  and performance marketing, used by brands to discover and recruit partners, track
  clicks and conversions, calculate and pay commissions, guard against fraud, and report
  on channel performance. Its API is built API-first — the Partnerize console runs on top
  of it — and is published as two OpenAPI documents, a Brands API and a Partners API,
  covering 327 operations across three concurrent versions (v1, v2 and v3) on
  api.partnerize.com, authenticated with HTTP Basic over an application key and a user
  API key.
