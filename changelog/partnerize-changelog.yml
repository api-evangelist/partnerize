notes:
  - >-
    Release bodies are empty on every 3.x tag on both platforms — the version and date are
    real and published, but Partnerize writes no release notes into them. The highlights
    recorded above for the 3.0.0 releases are read from the provider's own installation
    documentation, not from the release body.
  - >-
    Between 2.1.3 (April 2024) and 3.0.0 (April 2026) the iOS SDK went two years without a
    release, then shipped three versions in ten weeks. The Android line has no published
    releases before 3.0.0 at all.
