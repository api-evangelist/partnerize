generated: '2026-08-13'
method: searched
source: https://github.com/PerformanceHorizonGroup/partnerize-mobile-sdk-ios/releases
name: Partnerize Change Log
description: >-
  What Partnerize publishes about change, and what it does not. There is NO dated
  changelog or release-notes feed for the Brands or Partners REST API — the only dated,
  versioned change record Partnerize publishes is the GitHub release history of its two
  mobile SDKs, captured below. The API side is covered by a change-management POLICY
  (classes of change and notice periods) rather than a log of what actually changed.
scheme: semver
scope: mobile-sdk
api_changelog:
  published: false
  probes:
    - {url: 'https://api-docs.partnerize.com/changelog', status: 404}
    - {url: 'https://partnerize.com/resources/type/releases', status: 200, note: 'company press releases, not product release notes; entries carry no dates'}
  detail: >-
    Neither published API document (Brands, Partners) contains a changelog, release-notes
    or "what's new" section. Both declare info.version 1.4.99, which tracks the
    documentation build and not any of the three live API versions (v1, v2, v3). A
    consumer cannot answer "what changed in the API last month" from anything Partnerize
    publishes.
  policy_instead:
    url: https://api-docs.partnerize.com/brand/#section/API-Change-Management-Policy
    summary: >-
      Backwards-compatible changes ship with no advance notice and are communicated only by
      updating the documentation. Breaking changes and resource deprecations get at least
      three months' notice, delivered by email to affected consumers, with the resource
      marked Obsolete in the docs. Hotfixes for stability or security may waive the notice
      period.
    detail: lifecycle/partnerize-lifecycle.yml
    consequence: >-
      Because non-breaking changes are announced only by a documentation edit and the docs
      carry no changelog, a consumer's only mechanism for detecting an additive change is
      to diff the published OpenAPI themselves.
