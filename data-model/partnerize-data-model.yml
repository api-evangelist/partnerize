  - {from: Website, to: WebsiteType, type: belongs_to, via: website type reference}
  - {from: Website, to: PromotionalMethod, type: belongs_to, via: promotional method reference}
  - {from: Partner, to: PartnerGroup, type: has_many, via: campaign partner groups}
