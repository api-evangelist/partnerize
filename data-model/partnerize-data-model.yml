  - {from: Network, to: Partner, type: has_many, via: 'GET /network/{network_id}/publisher'}
  - {from: Network, to: PartnerCollection, type: has_many, via: '/v2/networks/{network_id}/partner-collections'}
  - {from: Network, to: TermsAndConditions, type: has_many, via: 'network terms and conditions (v1 and v3)'}
  - {from: Brand, to: Campaign, type: has_many, via: 'GET /user/advertiser/{advertiser_id}/campaign'}
  - {from: Brand, to: Invoice, type: has_many, via: 'GET /user/advertiser/{advertiser_id}/invoice'}
  - {from: Campaign, to: Participation, type: has_many, via: '/campaign/{campaign_id}/publisher'}
  - {from: Participation, to: Partner, type: belongs_to, via: publisher_id}
  - {from: Participation, to: Campaign, type: belongs_to, via: campaign_id}
  - {from: Campaign, to: Commission, type: has_many, via: '/v2/campaigns/{campaignId}/commissions'}
