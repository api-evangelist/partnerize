  - {from: Campaign, to: ProductFeed, type: has_many, via: '/campaign/{campaign_id}/feed'}
  - {from: Campaign, to: Deal, type: has_many, via: '/campaign/{campaign_id}/deal'}
  - {from: Campaign, to: TermsAndConditions, type: has_many, via: 'campaign terms and conditions + acknowledgments'}
  - {from: Campaign, to: TransactionQuery, type: has_many, via: '/campaign transaction queries'}
  - {from: Campaign, to: FraudIncident, type: has_many, via: '/v2/campaigns/{campaign_id}/fraud/metrics'}
  - {from: Campaign, to: MetaField, type: has_many, via: 'campaign extra fields and meta fields'}
  - {from: Partner, to: TrackingLink, type: has_many, via: '/v2/publishers/{publisher_id}/links'}
  - {from: TrackingLink, to: Click, type: has_many, via: 'clickref generated on click'}
  - {from: Click, to: Conversion, type: has_one, via: 'click reference carried into the conversion (clickref)'}
  - {from: Conversion, to: ConversionItem, type: has_many, via: 'conversion_items collection on the conversion'}
