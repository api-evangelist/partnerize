reference_data:
  description: >-
    Read-only lookup collections shared across the model. Every one is its own API entry in
    apis.yml, which is why the catalog carries 104 API entries for what is really two
    published documents.
  entities: [Country, Currency, Currency_Country, Locale, Timezone, US_State, Vertical, Device, Traffic_Source, Website_Type, Promotional_Method, Partnership_Model, Conversion_Type, Conversion_Status, Conversion_Metric, Transaction_Query_Reason, Transaction_Query_Type, Legal_Entities]
analytics_surface:
  description: >-
    The v3 analytics surface is a separate projection over Click and Conversion rather than
    a set of entities. Four verbs — count, filter, explode, timeseries — are offered
    symmetrically for both, and symmetrically for both audience contexts (/v3/brand and
    /v3/partner), which is where the duplicate operationIds in the catalog come from
    (postConversionsFilter exists once under brand and once under partner).
  overview_schemas: [Brand_Overview_*, Partner_Overview_*]
  dimensions: [adref, agent, context, country, creative, custref, device, partnership, product, pubref, source, type, period]
audience_split:
  description: >-
    The model is published twice, once per audience, and the two documents are not
    symmetric. The Brands API carries 175 paths and 99 schemas; the Partners API carries 77
    paths and 70 schemas. Publisher/Partner, Brand_Overview_*/Partner_Overview_* and
    Publisher_Website/Partner_Website are the same concepts renamed per audience — a
    consumer integrating both sides maintains two vocabularies for one data core.
