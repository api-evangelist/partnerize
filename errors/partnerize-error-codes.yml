notes:
  - >-
    Meanings are reproduced as published, including Partnerize's own typographical errors
    ("too hogh", "expeceted"), so this file stays a faithful capture of the provider's
    registry rather than an edited paraphrase.
  - >-
    The registry covers validation failures on 400 only. Codes returned on 401, 403, 404
    and 405 are the slugs unauthorized, entity_not_found and routing_error, documented in
    errors/partnerize-problem-types.yml rather than in a table.
  - >-
    No operation in openapi/ references either registry, so the codes are unavailable to
    any tool reading only the machine-readable specification.

