description: >-
  The published Partnerize error-code registry, captured verbatim from the Bad Request
  (Code 400) tables in the Version 2 and Version 3 API Conventions. v2 uses readable
  slugs; v3 replaced them with stable UUID constraint identifiers, so a v3 caller MUST
  carry this lookup table to turn error.errors[].code into a cause. This is the
  non-payments sibling of a decline-code catalog: Partnerize is not a card acquirer, so
  there are no decline codes, but this registry is the equivalent operational surface.
