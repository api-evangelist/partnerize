openapi: 3.2.0
info:
  title: Partnerize Partners Brand Discovery (v2) API
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
tags:
- name: Brand Discovery (v2)
paths:
  /v2/publishers/{publisherId}/discovery/advertisers:
    get:
      parameters:
      - name: publisherId
        in: path
        description: ID of the partner
        examples:
        - 1l1007802
        required: true
        schema:
          type: string
      operationId: getBrands
      tags:
      - Brand Discovery (v2)
      summary: List Brands & Campaigns
      description: 'Returns all campaigns available for a partner to join, grouped by brand.

        Each campaign will include a `status:` for the partner:-

        * AVAILABLE

        * REQUESTED

        * INVITED

        * REJECTED'
