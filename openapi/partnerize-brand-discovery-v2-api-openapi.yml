  /v2/publishers/{publisherId}/discovery/advertisers/{advertiserId}:
    get:
      parameters:
      - name: publisherId
        in: path
        description: ID of the partner
        examples:
        - 1l1007802
        required: true
        schema:
          type: string
      - name: advertiserId
        in: path
        description: ID of the brand
        examples:
        - 1l1007802
        required: true
        schema:
          type: string
      operationId: getBrand
      tags:
      - Brand Discovery (v2)
      summary: Retrieve a Brand
      description: 'Returns one advertiser with a list of campaigns availabe for a partner to join.

        Each campaign will include a `status:` for the partner:-

        * AVAILABLE

        * REQUESTED

        * INVITED

        * REJECTED'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $schema: http://json-schema.org/draft-04/schema
                type: object
                title: Advertiser
                properties:
                  advertiser:
                    allOf:
                    - $schema: http://json-schema.org/draft-04/schema#
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        display_name:
                          type: string
                        contact_email:
                          type:
                          - string
                          - 'null'
                        description:
                          type:
                          - string
                          - 'null'
                        advertiser_icon:
                          type:
                          - string
                          - 'null'
                        network:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                        address:
                          title: Postal Address
                          $schema: http://json-schema.org/draft-04/schema
                          type: object
                          properties:
                            line1:
                              anyOf:
                              - type: 'null'
                              - type: string
                            line2:
                              anyOf:
                              - type: 'null'
                              - type: string
                            line3:
                              anyOf:
                              - type: 'null'
                              - type: string
                            line4:
                              anyOf:
                              - type: 'null'
                              - type: string
                            postcode:
                              anyOf:
                              - type: 'null'
                              - type: string
                            country:
                              anyOf:
                              - type: 'null'
                              - type: string
                    - properties:
                        campaigns:
                          type: array
                          title: Campaign
                          items:
                            allOf:
                            - $ref: '#/paths/~1v2~1publishers~1%7BpublisherId%7D~1discovery~1advertisers/get/responses/200/content/application~1json/schema/properties/advertisers/items/allOf/1/properties/campaigns/items'
                            - properties:
                                campaign_icon:
                                  type:
                                  - string
                                  - 'null'
                additionalProperties: false
