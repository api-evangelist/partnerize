                        vertical:
                          $schema: http://json-schema.org/draft-04/schema
                          title: Vertical
                          type: object
                          properties:
                            id:
                              type: string
                              example: '1'
                            name:
                              type: string
                              example: Retail
                        promotional_method:
                          $schema: http://json-schema.org/draft-04/schema
