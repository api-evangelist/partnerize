                title: Partner Response
                properties:
                  partner:
                    $schema: http://json-schema.org/draft-04/schema
                    title: Partner
                    type: object
                    allOf:
                    - $schema: http://json-schema.org/draft-04/schema
                      title: Partner
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the partner
                          example: 111111l300761
                        name:
                          type: string
                          example: Partner UK
                        reporting_identifier:
                          type: string
                          example: wedo.com
                        active:
                          type: boolean
                          title: Partner Active Status
                          example: false
                        company_name:
                          type: string
                          example: Partner UK
                        company_logo:
                          oneOf:
                          - type: string
                          - type: 'null'
                          example: http://some.url/image.png
                        contact_name:
