      tags:
      - Campaign Transaction Queries
      description: Process multiple Transaction Queries in a single API call. The same rules as approving, rejecting and pending single Transaction Queries apply. The actions are processed asynchronously and the Job endpoint must be polled to find out when all have been completed.
      operationId: Bulk process Transaction Queries
      requestBody:
        content:
          application/json:
            schema:
              example:
                transaction_queries:
                - new_expected_commission: 13.45
                  new_reason: Example reason
                  new_state: pending
                  transaction_query_id: 1l1000532
              properties:
                transaction_queries:
                  items:
                    properties:
                      new_expected_commission:
                        description: expected commission value after the state change
                        type: number
                      new_reason:
                        description: reason for the state change
                        type: string
                      new_state:
                        $ref: '#/components/schemas/Transaction_Query_State'
                      transaction_query_id:
                        description: ID of the Transaction Query
                        type: string
                  type: array
              type: object
      summary: Bulk processing of Transaction Queries
