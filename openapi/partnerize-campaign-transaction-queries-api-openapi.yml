openapi: 3.2.0
info:
  title: Partnerize Brands Attribution … Campaign Transaction…
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
- description: Local
  url: http://api.partnerize.tech
tags:
- description: 'Transaction Queries (TQs) allow Partners to raise disputes about conversions with a Brand.

    There are three types of Transaction Queries:

    - Untracked: A conversion has not been tracked.

    - Incorrect Commission: A conversion does not have the correct Partner commission value.

    - Declined: The Brand has rejected a conversion.'
  name: Campaign Transaction Queries
paths:
  /campaign/{campaign_id}/tq:
    get:
      parameters:
      - description: ID of the Campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      - description: Filter by the ID of a transaction query
        example: 1l1000532
        in: query
        name: transaction_query_id
        required: false
        schema:
          type: string
      - description: Filter by the type
        example: untracked
        in: query
        name: transaction_query_type
        required: false
        schema:
          type: string
      - description: Filter by a partner reference
        example: A200FG1
        in: query
        name: publisher_reference
        required: false
        schema:
          type: string
      - description: Filter by a conversion reference
        example: AF222PO
        in: query
        name: conversion_reference
        required: false
        schema:
          type: string
      - description: Filter by a conversion date
        example: '2017-01-01 00:00:00'
        in: query
        name: conversion_date_time
        required: false
        schema:
          type: string
      - description: Filter by the ID of a campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      - description: Filter by the current state
        example: pending
        in: query
        name: current_state
        required: false
        schema:
          type: string
      - description: Field to filter the date range on
        example: created_at
        in: query
        name: date_range_column
        required: false
        schema:
          type: string
      - description: Start of a date range
        example: '2017-01-01 00:00:00'
        in: query
        name: date_range_start
        required: false
        schema:
          type: string
      - description: End of a date range
        example: '2017-12-30 00:00:00'
        in: query
        name: date_range_end
        required: false
        schema:
          type: string
      - description: Natural language representation of a date range
        example: last 10 days
        in: query
        name: text_date
        required: false
        schema:
          type: string
      - description: Field to sort the results by
        example: created_at
        in: query
        name: sort_column
        required: false
        schema:
          type: string
      - description: Direction to sort the results by
        example: ASC
        in: query
        name: order_by
        required: false
        schema:
          type: string
      - description: Download the results as a CSV file
        example: 'true'
        in: query
        name: tq_export
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    count: 5
                    execution_time: 0.08001 seconds
                    filters: {}
                    sort:
                      column: created_at
                      direction: ASC
                    transaction_queries:
                    - transaction_query:
                        actions_available:
                        - approve
                        - reject
                        campaign:
                          advertiser_id: 10l110
                          campaign_id: 10l176
                          created: '2017-01-01 00:00:00'
                          created_by: 11l16829
                          default_override: '1'
                          hidden_campaign: y
                          last_modified: '2017-01-01 00:00:00'
                          network_fee: null
                          payment_date: null
                          reporting_timezone: Australia/Sydney
                          status: a
                          title: Example Campaign
                          type: sale
                          vertical_id: 10
                          week_start: monday
