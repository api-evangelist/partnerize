              schema:
                properties:
                  count:
                    type: number
                  execution_time:
                    type: string
                  filters:
                    description: The filters applied to the results
                    properties: {}
                    type: object
                  sort:
                    properties:
                      column:
                        description: The column the results are sorted by
                        type: string
                      direction:
                        description: The direction the results are sorted in
                        enum:
                        - ASC
                        - DESC
                        type: string
                    type: object
                  transaction_queries:
                    items:
                      $ref: '#/components/schemas/Transaction_Query_Wrapper'
                    type: array
                type: object
          description: OK
      tags:
      - Campaign Transaction Queries
      description: Return the details of all Transaction Queries created on a campaign.
      operationId: List all Transaction Queries
      requestBody:
        content:
          application/json:
            schema:
              type: string
        description: Generate a CSV file in a job and send the result to this email address, helpful when processing takes too long for a normal download
      summary: List all Transaction Queries for a Campaign
