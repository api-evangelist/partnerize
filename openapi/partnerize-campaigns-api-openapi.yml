openapi: 3.2.0
info:
  title: Partnerize Brands Attribution Campaigns API
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
- description: Local
  url: http://api.partnerize.tech
tags:
- description: A Campaign is owned by a Brand and a Brand may have multiple Campaigns.
  name: Campaigns
paths:
  /campaign:
    get:
      parameters:
      - description: ID of the network
        example: 11l100
        in: query
        name: network_id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    campaigns:
                    - campaign:
                        advertiser_id: 10l110
                        allow_deep_linking: y
                        allow_third_party_pixel: y
                        append_url_parameters: ''
                        associated_campaigns: ''
                        automated_invoicing_date: 4
                        automated_invoicing_po_number: null
                        auto_approve_publisher: y
                        auto_rejected_ips: null
                        basket_value_cap: null
                        budget_summary_interval: null
                        budget_summary_start_time: null
