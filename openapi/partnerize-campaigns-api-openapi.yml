      description: To create a new Campaign, the Brand must pass their associated `advertiser_id`.
      operationId: createACampaign
      requestBody:
        content:
          application/json:
            schema:
              example:
                advertiser_id: 10l110
                allow_deep_linking: y
                allow_third_party_pixel: y
                append_url_parameters: ''
                associated_campaigns: ''
                auto_rejected_ips: null
                campaign_overloads:
                - publisher_id: 11111l1
                  append_url_parameters: ?a=b&c=d
                  basket_value_cap: 10.01
                  default_destination: http://example.com
                  description: Example
                  hide_hybrid_from_publisher: y
                  is_cpc: n
                  prepend_url_string: http://example.com
                  test_mode: y
                campaign_icon: http://example.com/path/to/image.png
                campaign_logo: http://performancehorizon.com/logo.png
                campaign_notes: ''
                cookie_period: 0
                default_commission_rate: '5'
                default_currency: GBP
                description:
                  en: <p>Awesome new campaign</p>
                destination_url: http://www.performancehorizon.com
                hidden_campaign: y
                multiple_conversions_per_click: n
                prepend_url_string: http://google.com
                secure_tracking: y
                terms:
                  en:
                    terms: Important campaign terms and conditions
                test_mode: y
                title: PHG Aff Demo
                tq_auto_approve: 60
                tracking_method: s2s
                unique_conversion_refs: y
                vertical_id: 10
                vertical_name: Other
              oneOf:
              - properties:
                  default_commission_rate:
                    type: string
                type: object
              - properties:
                  default_commission_value:
                    type: string
                type: object
              properties:
                advertiser_id:
                  description: ID of the brand the campaign should belong to
                  type: string
                allow_deep_linking:
                  $ref: '#/components/schemas/YesOrNo'
                allow_third_party_pixel:
                  $ref: '#/components/schemas/YesOrNo'
                append_url_parameters:
                  type: string
                associated_campaigns:
                  type: string
                auto_rejected_ips:
                  type:
                  - string
                  - 'null'
                campaign_icon:
                  description: Url of image to download. Supports PNG and JPEG only.
                  type:
                  - string
                  - 'null'
                campaign_icon_upload:
                  description: Base64 encoded data url of image to upload. Supports PNG and JPEG only.
                  type:
                  - string
                  - 'null'
                campaign_logo:
                  type:
                  - string
                  - 'null'
                campaign_overloads:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    properties:
                      publisher_id:
                        type: string
                      append_url_parameters:
                        type: string
                      basket_value_cap:
                        type: string
                      default_destination:
                        type: string
                      description:
                        type: string
                      hide_hybrid_from_publisher:
                        $ref: '#/components/schemas/YesOrNo'
                      is_cpc:
                        $ref: '#/components/schemas/YesOrNo'
                      prepend_url_string:
                        type: url
                      test_mode:
                        $ref: '#/components/schemas/YesOrNo'
                    required:
                    - publisher_id
                campaign_notes:
                  type: string
                cookie_period:
                  type: number
                default_currency:
                  enum:
                  - GBP
                  - USD
                  - EUR
                  - JPY
                  type: string
                description:
                  properties:
                    en:
                      type: string
                      description: 'Supports the following HTML tags with no attributes: p, h1-h6, b, i, u, ol, ul, li'
                  type:
                  - object
                  - 'null'
                destination_url:
                  type: string
                hidden_campaign:
                  $ref: '#/components/schemas/YesOrNo'
                multiple_conversions_per_click:
                  anyOf:
                  - enum:
                    - y
                    - n
                    type: string
                  - enum:
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
                    - 7
                    - 8
                    - 9
                    - 10
                    type: number
                prepend_url_string:
                  description: Prepend all destination URLs
                  type:
                  - string
                  - 'null'
                secure_tracking:
                  $ref: '#/components/schemas/YesOrNo'
                terms:
                  properties:
                    en:
                      properties:
                        terms:
                          type: string
                      type: object
                  type:
                  - object
                  - 'null'
                test_mode:
                  $ref: '#/components/schemas/YesOrNo'
                title:
                  type: string
                tq_auto_approve:
                  type: number
                tracking_method:
                  enum:
                  - pixel
                  - api
                  - s2s
                  type: string
                unique_conversion_refs:
                  enum:
                  - y
                  - n
                  - ignore
                  type: string
                vertical_id:
                  type: number
                vertical_name:
                  type: string
              required:
              - advertiser_id
              - title
              - destination_url
              type: object
      summary: Create a Campaign
