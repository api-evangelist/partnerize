              schema:
                properties:
                  campaigns:
                    items:
                      $ref: '#/components/schemas/Campaign_Wrapper'
                    type: array
          description: OK
      tags:
      - Campaigns
      description: 'Return the details of all Campaigns attached to the Network account and visible to the authenticated User.

        The output is contextual based on the permissions of the User making the request to the endpoint. A limited Campaign

        schema will be utilised for any Campaign that the User does not have appropriate permissions to view.'
      operationId: listAllCampaigns
      summary: List all Campaigns
    post:
      responses:
        '200':
          content:
            application/json; charset=utf-8:
