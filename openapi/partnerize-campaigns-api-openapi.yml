                  type: array
                  items:
                    type: object
                    properties:
                      iso:
                        type: string
                        example: GB
                associated_campaigns:
                  type: string
                auto_rejected_ips:
                  type: string
                  description: Comma separated list
                  example: 1.1.1.1,2.2.2.2
                campaign_notes:
                  type: string
                campaign_overloads:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    properties:
                      publisher_id:
                        type: string
                      append_url_parameters:
                        type: string
                        example: ?a=b&c=d
                      basket_value_cap:
                        type: float
                        example: 10.01
                      default_destination:
                        type: string
                      description:
                        type: string
                      hide_hybrid_from_publisher:
                        $ref: '#/components/schemas/YesOrNo'
                      is_cpc:
                        $ref: '#/components/schemas/YesOrNo'
                      prepend_url_string:
                        type: url
                        example: http://example.com
                      test_mode:
                        $ref: '#/components/schemas/YesOrNo'
                    required:
                    - publisher_id
                week_start:
                  type: string
                  enum:
                  - Monday
                  - Tuesday
                  - Wednesday
                  - Thursday
                  - Friday
                  - Saturday
                  - Sunday
                vertical_id:
                  type: string
                default_currency:
                  type: string
                  example: GBP
                multiple_conversions_per_click:
                  oneOf:
                  - type: string
                    enum:
                    - y
                    - n
                    - suppress
                  - type: integer
                unique_conversion_refs:
                  type: string
                  enum:
                  - y
                  - n
                  - ignore
                reporting_timezone:
                  type: string
                  example: Australia/Melbourne
                tracking_method:
                  type: string
                  enum:
                  - pixel
                  - s2s
                  - api
                deeplink_method:
                  type: string
                  enum:
                  - standard
                  - direct
                cookie_period:
                  type: integer
                  minimum: 0
                tq_auto_approve:
                  type: integer
                  minimum: 0
                campaign_logo:
                  type: string
                  format: uri
                short_link_subdomain:
                  type: string
                  minLength: 1
                app_tracking_provider:
                  type: string
                  enum:
                  - branch
                  - partnerize
                app_tracking_provider_tracking_link:
                  type: string
                test_mode:
                  type: string
                  enum:
                  - y
                  - n
                hidden_campaign:
                  type: string
                  enum:
                  - y
                  - n
                allow_deep_linking:
                  type: string
                  enum:
