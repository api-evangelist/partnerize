openapi: 3.2.0
info:
  title: Partnerize Partners Conversion Metrics API
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
tags:
- name: Conversion Metrics
paths:
  /reference/conversion_metric:
    get:
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    conversion_metrics:
                    - conversion_metrics:
                        ref_conversion_metric_id: 3
                        title: App Download
                        description: ''
                        skip_invoice: 0
                        skip_selfbill: 0
                        skip_override: 0
              schema:
                properties:
                  website_types:
                    items:
                      $ref: '#/components/schemas/Conversion_Metric'
                    type: array
                type: object
          description: OK
      tags:
      - Conversion Metrics
      description: List all available Conversion Metrics.
      operationId: List Conversion Metrics
      summary: List Conversion Metrics
components:
  schemas:
    Conversion_Metric:
      properties:
        partnership_model:
          properties:
            ref_conversion_metric_id:
              type: number
            title:
              type: string
            description:
              type: string
            skip_invoice:
              type: string
            skip_selfbill:
              type: string
            skip_override:
              type: string
          type: object
      type: object
