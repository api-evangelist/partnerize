                          - percentage_average_partner_commission
                          - total_order_value
                          - advertiser_reference
                          - average_order_value
                          - conversion_rejection_rate
                          - average_order_size
                          - browser_family
                          - browser_major
                          - browser_minor
                          - browser_patch
                          - campaign_id
                          - campaign_name
                          - category
                          - conversion_metric_id
                          - conversion_metric_name
                          - conversion_status
                          - conversion_type_id
                          - conversion_type_name
                          - country
                          - country_name
                          - creative_id
                          - creative_description
                          - creative_advertiser_reference
                          - currency
                          - customer_type
                          - date_time
                          - device_id
                          - device_name
                          - os_family
                          - os_major
                          - os_minor
                          - os_patch
                          - partner_id
                          - partner_name
                          - publisher_reference
                          - partnership_model_id
                          - partnership_model_name
                          - sku
                          - traffic_source_id
                          - traffic_source_name
                          - type
