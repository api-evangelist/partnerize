                      - conversion_type
                      - country
                      - creative
                      - currency
                      - customer_type
                      - date_time
                      - device
                      - os_family
                      - os_major
                      - os_minor
                      - os_patch
                      - partner
                      - publisher_reference
                      - partnership_model
                      - sku
                      - traffic_source
                      - type
