openapi: 3.2.0
info:
  title: Partnerize Conversions API
  version: 1.4.99
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
  description: 'Operations tagged Conversions across 2 of this provider''s published API definitions: partnerize-partners-api-openapi.yml, partnerize-conversions-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Production
  url: https://api.partnerize.com
- description: Local
  url: http://api.partnerize.tech
tags:
- name: Conversions
  description: Endpoints for analysing conversion data
paths:
  /v3/partner/analytics/conversions/count:
    post:
      summary: Count
      description: 'Returns aggregated metrics derived from conversions.


        This endpoint is ideal for creating dashboard widgets, or for creating a summary of tabulated data from the explode endpoint.'
      operationId: postConversionsCount
      tags:
      - Conversions
      requestBody:
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              required:
              - date_time_ranges
              - scope
              - metrics
              properties:
                date_time_ranges:
                  allOf:
                  - $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/date_time_ranges/allOf/0'
                  - items:
                      properties:
                        field:
                          $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1explode/post/requestBody/content/application~1json/schema/properties/interval/properties/field'
                comparison_date_time_ranges:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1count/post/requestBody/content/application~1json/schema/properties/date_time_ranges'
                scope:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/scope'
                metrics:
                  allOf:
                  - $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/metrics/allOf/0'
                  - items:
                      type: string
                      enum:
                      - total_conversion_items
                      - total_conversions
                      - total_partner_commission
                      - percentage_average_partner_commission
                      - average_order_value
                      - total_order_value
                      - conversion_rejection_rate
                      - average_order_size
                      - percentage_order_value
                      - percentage_partner_commission
                      - average_partner_commission
                filter_by:
                  allOf:
                  - $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/filter_by/allOf/0'
                  - items:
                      properties:
                        field:
                          type: string
                          enum:
                          - partner_commission
                          - order_value
                          - advertiser_reference
                          - browser_family
                          - browser_major
                          - browser_minor
                          - browser_patch
                          - campaign_id
                          - campaign_name
                          - category
                          - conversion_metric_id
                          - conversion_status
                          - conversion_type_id
                          - country
                          - creative_id
                          - creative_description
                          - creative_advertiser_reference
                          - currency
                          - customer_type
                          - device_id
                          - os_family
                          - os_major
                          - os_minor
                          - os_patch
                          - partner_id
                          - partner_name
                          - publisher_reference
                          - partnership_model_id
                          - sku
                          - traffic_source_id
                          - type
                          - user_context_id
                          - voucher_code
                          - voucher_status
                        operator:
                          description: 'String fields can be filtered with: `EQUALS`, `STARTS_WITH`, `ENDS_WITH`, `CONTAINS`, `SEARCH`. Numeric fields can be filtered with `EQUALS`, `GREATER_THAN`, `GREATER_THAN_OR_EQUALS`, `LESS_THAN`, `LESS_THAN_OR_EQUALS`.'
                      if:
                        properties:
                          field:
                            type: string
                            enum:
                            - partner_commission
                            - order_value
                      then:
                        properties:
                          operator:
                            type: string
                            enum:
                            - EQUALS
                            - GREATER_THAN
                            - GREATER_THAN_OR_EQUALS
                            - LESS_THAN
                            - LESS_THAN_OR_EQUALS
                      else:
                        properties:
                          operator:
                            $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/filter_by/allOf/1/items/properties/operator'
                output_currency:
                  description: Currency based metrics will be converted into this currency. This also applies to filter values. See reference endpoint [/reference/currencies/](/#tag/Currencies) for available currencies.
                  type: string
                  default: USD
                timezone:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/timezone'
                include_comparison_percentage_change:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/include_comparison_percentage_change'
              additionalProperties: false
            example:
              date_time_ranges:
              - start: '2019-10-01T00:00:00+00:00'
                end: '2019-10-03T00:00:00+00:00'
              scope:
                partner: 111111l10
              metrics:
              - total_partner_commission
              filter_by:
              - field: country
                value: US
                operator: EQUALS
              - field: device_id
                value: 5
                operator: EQUALS
                not: true
              output_currency: GBP
              timezone: GMT
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    example:
                      total_conversions: 12
          headers:
            X-Approximate-Metrics:
              schema:
                type: string
                example: total_unique_clicks
              description: 'Comma-separated list of metrics that are approximates. The metric does not have to be part of the current request.

                Present if conditions for approximation are met, and at least one metric on the context is an approximate.

                '
    servers:
    - description: Production
      url: https://api.partnerize.com
  /v3/partner/analytics/conversions/explode:
    post:
      summary: Explode
      description: 'Returns aggregated metrics derived from conversions, grouped by ID and name of one or many dimensions. This endpoint is ideal for

        fetching data to be shown in a table. You can combine it with the count endpoint to fetch data for a totals row.


        If `order_by` is requested on a metric, the metric values will be added to the results, even if not requested.


        When grouping by `date`, the `interval` will define the length of each date group.'
      operationId: postConversionsExplode
      tags:
      - Conversions
      requestBody:
        content:
          application/json:
            schema:
              $schema: http://json-schema.org/draft-07/schema#
              type: object
              required:
              - date_time_ranges
              - scope
              - metrics
              - group_by
              properties:
                date_time_ranges:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1count/post/requestBody/content/application~1json/schema/properties/date_time_ranges'
                comparison_date_time_ranges:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1count/post/requestBody/content/application~1json/schema/properties/date_time_ranges'
                scope:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/scope'
                metrics:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1count/post/requestBody/content/application~1json/schema/properties/metrics'
                group_by:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1filter/post/requestBody/content/application~1json/schema/properties/group_by'
                filter_by:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1count/post/requestBody/content/application~1json/schema/properties/filter_by'
                order_by:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1filter/post/requestBody/content/application~1json/schema/properties/order_by'
                interval:
                  allOf:
                  - $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1explode/post/requestBody/content/application~1json/schema/properties/interval/allOf/0'
                  properties:
                    field:
                      type: string
                      enum:
                      - date_time
                      - approved_at
                      - check_in_date
                      - check_out_date
                output_currency:
                  $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1count/post/requestBody/content/application~1json/schema/properties/output_currency'
                output_date_time_format:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1explode/post/requestBody/content/application~1json/schema/properties/output_date_time_format'
                top:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1filter/post/requestBody/content/application~1json/schema/properties/top'
                include_total_row_count:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1filter/post/requestBody/content/application~1json/schema/properties/include_total_row_count'
                timezone:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/timezone'
                include_comparison_percentage_change:
                  $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1count/post/requestBody/content/application~1json/schema/properties/include_comparison_percentage_change'
              additionalProperties: false
            example:
              date_time_ranges:
              - start: '2019-10-01T00:00:00+00:00'
                end: '2019-10-03T00:00:00+00:00'
              scope:
                partner: 111111l10
              metrics:
              - total_partner_commission
              group_by:
              - country
              filter_by:
              - field: country
                value: US
                operator: EQUALS
              - field: device_id
                value: 5
                operator: EQUALS
                not: true
              order_by:
              - field: total_commission
                direction: DESCENDING
              interval:
                field: date_time
                period: P1D
              output_currency: USD
              top: 2
              include_total_row_count: false
              timezone: GMT
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    example:
                    - device_id: '1'
                      device_name: desktop
                      total_conversions: 2000
                    - device_id: '2'
                      device_name: mobile
                      total_conversions: 3000
          headers:
            X-Total-Row-Count:
              $ref: '#/paths/~1v3~1partner~1analytics~1clicks~1filter/post/responses/200/headers/X-Total-Row-Count'
            X-Approximate-Metrics:
              $ref: '#/paths/~1v3~1partner~1analytics~1conversions~1count/post/responses/200/headers/X-Approximate-Metrics'
    servers:
    - description: Production
      url: https://api.partnerize.com
  /v3/partner/analytics/conversions/filter:
