                        width: 400
              schema:
                properties:
                  creatives:
                    items:
                      $ref: '#/components/schemas/Creative_Wrapper'
                    type: array
                type: object
          description: OK
      tags:
      - Creatives
      description: List and view all Creatives for the specified Campaign.
      operationId: List all Creatives for a Campaign
      summary: List all Creatives for a Campaign
    post:
