      parameters:
      - description: ID of the Campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    creatives:
                    - creative:
                        tags: ''
                        active: y
                        advertiser_reference: Promotion July 2020
                        campaign_id: 10l176
                        created_at: '2016-04-07 04:21:51'
                        created_by: '300621'
                        creative_id: '300441'
                        creative_items:
                        - tags: ''
