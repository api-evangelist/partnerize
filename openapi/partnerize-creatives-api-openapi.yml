                    type: array
                type: object
          description: OK
      tags:
      - Creatives
      description: Create one or more Creative Tags against the Campaign entity. Each Tag is sent as an array within a top level `tags` array.
      operationId: Create Campaign Creative Tags
      requestBody:
        content:
          application/json:
            schema:
              example:
                tags:
                - name: promo
              properties:
                tags:
                  items:
                    $ref: '#/components/schemas/Creative_Tag_Wrapper'
                  type: array
              type: object
      summary: Create Campaign Creative Tags
    put:
      parameters:
      - description: ID of the Campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    creative_tags:
                    - creative_tag:
                        campaign_id: 10l176
                        created_at: '2016-04-07 04:21:51'
                        created_by: '300621'
                        creative_tag_id: 111111l2
                        creatives:
                        - creative_id: '300441'
                          creative_item_id: '300396'
                        name: logo
              schema:
                properties:
                  creative_tags:
                    items:
                      $ref: '#/components/schemas/Creative_Tag_Wrapper'
                    type: array
                type: object
          description: OK
      tags:
      - Creatives
      description: Update one or more Creative Tags against the Campaign entity. Each Tag is sent as an array within a top level `tags` array and must contain its associated `creative_tag_id`.
      operationId: Update Campaign Creative Tags
      requestBody:
        content:
          application/json:
            schema:
              example:
                tags:
                - creative_tag_id: 111111l2
                  name: promotion
              properties:
                tags:
                  items:
                    $ref: '#/components/schemas/Creative_Tag_Wrapper'
                  type: array
              type: object
      summary: Update Campaign Creative Tags
    delete:
      parameters:
      - description: ID of the Campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
