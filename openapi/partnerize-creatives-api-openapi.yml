                        name: logo
              schema:
                properties:
                  creative_tags:
                    items:
                      $ref: '#/components/schemas/Creative_Tag_Wrapper'
                    type: array
                type: object
          description: OK
      tags:
      - Creatives
      description: Delete one or more Creative Tags against the Campaign entity. Each Tag is sent as an array within a top level `tags` array and must contain its associated `creative_tag_id`.
      operationId: Delete Campaign Creative Tags
      requestBody:
        content:
          application/json:
            schema:
              example:
                tags:
                - creative_tag_id: 111111l2
              properties:
                tags:
                  items:
                    $ref: '#/components/schemas/Creative_Tag_Wrapper'
                  type: array
              type: object
      summary: Delete Campaign Creative Tags
  /campaign/{campaign_id}/creative_tags/creative:
    get:
      parameters:
      - description: ID of the Campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      - description: An array of tags IDs to filter the creatives by
        example: 1011l56,1011l57
        in: query
        name: tags[]
        required: false
        schema:
          type: string
        allowReserved: true
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    creatives:
                    - creative:
                        tags: ''
                        active: y
                        advertiser_reference: Promotion July 2020
                        campaign_id: 10l176
                        created_at: '2016-04-07 04:21:51'
                        created_by: '300621'
                        creative_id: '300441'
                        creative_items:
                        - tags:
