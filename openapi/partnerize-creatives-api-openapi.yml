                          preview: https://demo.prf.hn/preview/screativeref:300396
                          specific_destination: ''
                        creative_tracking_link: ''
                        creative_tracking_link_rotate: ''
                        creative_type_id: 1
                        custom_append_url_parameters: ''
                        custom_prepend_url_parameters: ''
                        default_specific_creative_id: '300396'
                        description: Demo Text
                        destination: http://www.partnerize.com
                        dynamic_tracking_link: ''
                        end_date_time: '2013-09-30 15:00:00'
                        height: 360
                        html_tracking_link: ''
                        limits: ''
                        preview: https://demo.prf.hn/preview/creativeref:300442
                        start_date_time: '2013-08-31 15:00:00'
                        width: 400
              schema:
                properties:
                  creatives:
                    items:
                      $ref: '#/components/schemas/Creative_Wrapper'
                    type: array
                type: object
          description: OK
      tags:
      - Creatives
      description: List and view all Creatives for the specified Campaign and filter by tags.
      operationId: List all Creatives for a Campaign by Tags
      summary: List all Creatives for a Campaign by Tags
components:
  schemas:
    Creative_Wrapper:
      properties:
        creative:
          $ref: '#/components/schemas/Creative'
      type: object
    Creative_Item:
      properties:
        content_type:
          type: string
        creative_item_id:
          description: ID of the creative item
          type: string
        description:
          type: string
        filename:
          type: string
        img_url:
          type: string
        preview:
          type: string
        specific_destination:
          type: string
        created_by:
          type: string
        created_at:
          type: string
        tags:
          type: string
        active:
          $ref: '#/components/schemas/YesOrNo'
        campaign_id:
          description: ID of the campaign
          type: string
        creative_type_id:
          type: number
        custom_append_url_parameters:
          type: string
        custom_prepend_url_parameters:
          type: string
      required:
      - creative_type_id
      type: object
    YesOrNo:
      enum:
      - y
      - n
      type: string
    Creative:
      properties:
        creative_id:
          description: ID of the creative
          type: string
        advertiser_reference:
          type: string
        creative_items:
          items:
            $ref: '#/components/schemas/Creative_Item'
          type: array
        creative_tracking_link:
          type: string
        creative_tracking_link_rotate:
          type: string
        default_specific_creative_id:
          type: string
        description:
          type: string
        destination:
          type: string
        dynamic_tracking_link:
          type: string
        height:
          type: number
        html_tracking_link:
          type: string
        limits:
          type: string
        preview:
          type: string
        width:
          type: number
        tags:
          type: string
        active:
          $ref: '#/components/schemas/YesOrNo'
        campaign_id:
          description: ID of the campaign
          type: string
        creative_type_id:
          type: number
        custom_append_url_parameters:
          type: string
        custom_prepend_url_parameters:
          type: string
        start_date_time:
          type: string
        end_date_time:
          type: string
        created_by:
          type: string
        created_at:
          type: string
      required:
      - creative_type_id
      type: object
    Creative_Tag_Wrapper:
      properties:
        creative_tag:
          $ref: '#/components/schemas/Creative_Tag'
      type: object
    Creative_Tag:
      properties:
        campaign_id:
          description: ID of the Campaign
          type: string
        creative_tag_id:
          description: ID of the Creative Tag
          type: string
        creatives:
          items:
            properties:
              creative_id:
                description: ID of the Creative
                type: string
              creative_item_id:
                description: ID of the Creative Item
                type: string
          type: array
        name:
          type: string
        created_by:
          type: string
        created_at:
          type: string
      required:
      - name
      type: object
