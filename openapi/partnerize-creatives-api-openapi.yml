openapi: 3.2.0
info:
  title: Partnerize Brands Attribution Creatives API
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
- description: Local
  url: http://api.partnerize.tech
tags:
- description: 'A Brand may wish to offer pre-generated _Creative_ so that the Partners can advertise the Brand easily. It is possible to categorise Creative with tags and there are 3 distinct Creative formats: Image, HTML and Text. Brands can organise their Creatives in a flexible structure by using _Creative Tags_.'
  name: Creatives
paths:
  /campaign/{campaign_id}/creative:
