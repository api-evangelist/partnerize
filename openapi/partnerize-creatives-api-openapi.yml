  /campaign/{campaign_id}/creative/tags:
    get:
      parameters:
      - description: ID of the Campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    creative_tags:
                    - creative_tag:
                        campaign_id: 10l176
                        created_at: '2016-04-07 04:21:51'
                        created_by: '300621'
                        creative_tag_id: 111111l2
                        creatives:
                        - creative_id: '300441'
                          creative_item_id: '300396'
                        name: logo
              schema:
                properties:
                  creative_tags:
                    items:
                      $ref: '#/components/schemas/Creative_Tag_Wrapper'
                    type: array
                type: object
          description: OK
      tags:
      - Creatives
      description: View all Creative Tags for the specified Campaign.
      operationId: List all Creative Tags for Campaign
      summary: List all Creative Tags for Campaign
    post:
      parameters:
      - description: ID of the campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
