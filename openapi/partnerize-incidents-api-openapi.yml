  /v2/campaigns/{campaign_id}/fraud/incident-partners:
    parameters:
    - name: campaign_id
      in: path
      description: Campaign ID
      required: true
      schema:
        type: string
    get:
      summary: List Incident-partners
      tags:
      - Incidents
      parameters:
      - name: metric
        in: query
        description: 'Filter the query by incident `metric`. This parameter must be used in conjunction with `type`.

          '
        required: false
        schema:
          type: string
          enum:
          - volume_clicks
          - volume_conversions
          - conversion_ratio
          - basket_variability_sku
          - conversion_value
          - ttc
      - name: type
        in: query
        description: 'Filter the query by incident `type`. This parameter must be used in conjunction with `metric`.

          '
        required: false
        schema:
          type: string
          enum:
          - partner
          - conversion
      - name: status
        in: query
        description: Filter the query by incident `status`.
        required: false
        schema:
          type: string
          enum:
          - active
          - deleted
      - name: start_date
        in: query
        description: Only consider incidents after this date.
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Only consider incidents before this date.
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $schema: http://json-schema.org/draft-07/schema
                type: object
                title: GET incident-partners Response
                description: This is the response to a GET incident-partners call on the PzAPI.
                required:
                - incident-partners
                properties:
                  incident-partners:
                    type: array
                    additionalItems: false
                    items:
                      type: object
                      required:
                      - partner_id
                      - partner_name
                      properties:
                        partner_id:
                          type: string
                        partner_name:
                          type: string
                      additionalProperties: false
                additionalProperties: false
        '400':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
              examples:
                Bad Status:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_status
                        message: No status with the name `status` was found
                      code: 400
                      message: Bad Request
                Bad Metric:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_metric
                        message: No metric with the name `metric` was found
                      code: 400
                      message: Bad Request
                Bad Metric Type:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_metric_type
                        message: No metric type of `metric_type` was found
                      code: 400
                      message: Bad Request
                Bad Request:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_params
                        message: If you specify a metric filter, you must also specify type
                      code: 400
                      message: Bad Request
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
              examples:
                Unauthorised:
                  value:
                    error:
                      errors:
                      - type: error
                        code: unauthorised
                        message: Feature 'fraud_detection' not enabled for this Network
                      code: 403
                      message: Forbidden
        '503':
          description: Fraud Service Unavailable
          content:
            application/json:
              examples:
                Fraud Service Unavailable:
                  value:
                    error:
                      errors:
                      - type: error
                        code: remote_service_unavailable
                        message: The remote service 'Fraud Detection' is currently unavailable
                      code: 503
                      message: Remote Service Unavailable
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
      description: Get a list of all partners that are associated with incidents.
      operationId: get-incident-partners
components:
  schemas:
    Fraud_Incident_Metric_Conversion_Value:
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/Fraud_Incident_Type_IP_Address'
        - $ref: '#/components/schemas/Fraud_Incident_Type_Partner'
      - type: object
        description: Properties for Conversion value
        allOf:
        - type: object
          required:
          - metric
          properties:
            metric:
              type: string
              description: The metric name
              enum:
              - conversion_value
        - allOf:
          - $ref: '#/components/schemas/Fraud_Incident_Metric_Ttc/allOf/1/allOf/1'
          - type: object
            required:
            - data
            properties:
              data:
                type: object
                required:
                - currency
                properties:
                  currency:
                    type: string
                    description: The campaigns default currency
          - $ref: '#/components/schemas/Fraud_Incident_Metric_Ttc/allOf/1/allOf/2'
    Fraud_Incident_Metric_Basket:
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/Fraud_Incident_Type_IP_Address'
        - $ref: '#/components/schemas/Fraud_Incident_Type_Partner'
      - type: object
        description: Properties unique to fraud incident baskets
        allOf:
        - type: object
          required:
          - metric
          properties:
            metric:
              type: string
              description: The metric name
              enum:
              - basket_variability_sku
        - type: object
          description: This is supplemental data for fraud incident baskets
          required:
          - data
          properties:
            data:
              type: object
              required:
              - conversions
              - total
              properties:
                total:
                  type: number
                  description: Total value of this basket
                conversions:
                  type: array
                  items:
                    type: object
                    title: The Items Schema
                    required:
                    - items
                    - count
                    - conversion_reference
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - sku
                          - category
                          - status
                          properties:
                            id:
                              type: string
                              description: The conversion item ID
                            sku:
                              type: string
                              description: The conversion item SKU
                            category:
                              type: string
                              description: The conversion item category
                            status:
                              type: string
                              description: Status of the conversion item
                      count:
                        type: integer
                        description: The number of items
                      conversion_reference:
                        type: string
                        description: The conversion reference
        - $ref: '#/components/schemas/Fraud_Incident_Metric_Ttc/allOf/1/allOf/2'
    Fraud_Incident_Type_IP_Address:
      allOf:
      - $ref: '#/components/schemas/Fraud_Incident_Base'
      - type: object
        properties:
          ip_address:
            type: string
            description: A hashed identifier for an IP address
        required:
        - ip_address
    Fraud_Incident_Metric_Basic:
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/Fraud_Incident_Type_IP_Address'
        - $ref: '#/components/schemas/Fraud_Incident_Type_Partner'
      - type: object
        description: Properties that all indicent types share
        required:
        - metric
        allOf:
        - type: object
          properties:
            metric:
              type: string
              description: The metric name
              enum:
              - volume_clicks
              - volume_conversions
              - conversion_ratio
        - $ref: '#/components/schemas/Fraud_Incident_Metric_Ttc/allOf/1/allOf/2'
    Fraud_Incident_Type_Partner:
      allOf:
      - $ref: '#/components/schemas/Fraud_Incident_Base'
      - type: object
        properties:
          partner:
            type: object
            properties:
              id:
                description: ID of the partner
                type: string
              name:
                description: The name of the partner
                type: string
            required:
            - id
            - name
        required:
        - partner
    Fraud_Incident_Metric_Ttc:
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/Fraud_Incident_Type_IP_Address'
        - $ref: '#/components/schemas/Fraud_Incident_Type_Partner'
      - type: object
        description: Properties for ttc
        allOf:
        - type: object
          required:
          - metric
          properties:
            metric:
              type: string
              description: The metric name
              enum:
              - ttc
        - type: object
          description: This is supplemental data for fraud incidents ttc and conversion value
          required:
          - data
          properties:
            data:
              type: object
              required:
              - conversion_reference
              - conversion_items
              properties:
                conversion_reference:
                  type: string
                  description: The conversion reference
                conversion_items:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - sku
                    - category
                    - status
                    properties:
                      id:
                        type: string
                        description: The conversion item ID
                      sku:
                        type: string
                        description: The conversion item SKU
                      category:
                        type: string
                        description: The conversion item category
                      status:
                        type: string
                        description: Status of the conversion item
        - type: object
          description: This is supplemental data common to all fraud incidents
          required:
          - data
          properties:
            data:
              type: object
              required:
              - threshold
              - value
              properties:
                threshold:
                  type: number
                  description: The threshold for this metric
                value:
                  type: number
                  description: The actual value of this metric
    Fraud_Incident_Base:
      properties:
        id:
          description: A unique ID for the incident
          type: string
        type:
          description: Which type of entity triggered this incident
          type: string
          enum:
          - ip_address
          - conversion
          - partner
        date:
          description: The date of the incident
          type: string
        time_window:
          description: Over how many days did we calculate the metric
          type: string
        status:
          description: Status of the record
          type: string
          enum:
          - active
          - deleted
        created_at:
          description: Timestamp of the record creation
          type: string
        deleted_at:
          description: Timestamp of the record deletion
          type: string
      required:
      - id
      - type
      - date
      - time_window
      - status
      - created_at
      - deleted_at
