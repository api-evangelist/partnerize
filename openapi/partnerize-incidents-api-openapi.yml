openapi: 3.2.0
info:
  title: Partnerize Brands Attribution Incidents API
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
- description: Local
  url: http://api.partnerize.tech
tags:
- name: Incidents
paths:
  /v2/campaigns/{campaign_id}/fraud/incidents:
    parameters:
    - name: campaign_id
      in: path
      description: Campaign ID
      required: true
      schema:
        type: string
    get:
      summary: List Incidents
      tags:
      - Incidents
      parameters:
      - name: partner_id
        in: query
        description: Partner ID to filter
        required: false
        schema:
          type: string
      - name: ip_address
        in: query
        description: IP address to filter
        required: false
        schema:
          type: string
      - name: metric
        in: query
        description: 'Filter the query by incident `metric`. This parameter must be used in conjunction with `type`.

          '
        required: false
        schema:
          type: string
          enum:
          - volume_clicks
          - volume_conversions
          - conversion_ratio
          - basket_variability_sku
          - conversion_value
          - ttc
      - name: type
        in: query
        description: 'Filter the query by incident `type`. This parameter must be used in conjunction with `metric`.

          '
        required: false
        schema:
          type: string
          enum:
          - partner
          - conversion
          - ip_address
      - name: status
        in: query
        description: Filter the query by incident `status`.
        required: false
        schema:
          type: string
          enum:
          - active
          - deleted
      - name: start_date
        in: query
        description: Only include incidents after this date.
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: Only include incidents before this date.
        required: false
        schema:
          type: string
          format: date
      - name: cursor_id
        in: query
        description: Cursor used for pagination.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the number of incidents returned.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  incidents:
                    description: A plurality of incident
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/Fraud_Incident_Type_Partner'
                      - $ref: '#/components/schemas/Fraud_Incident_Type_IP_Address'
                  limit:
                    description: The number of Incidents to be returned in the response. Used for pagination.
                    type: integer
                  cursor_id:
                    description: The current cursor_id, representing the first Incident ID in the response set. Used for pagination.
                    type: string
                  hypermedia:
                    properties:
                      links:
                        type: object
                        title: Hypermedia Pagination
                        description: Fraud Hypermedia. Provides URIs for pagination.
                        required:
                        - links
                        properties:
                          pagination:
                            type: object
                            properties:
                              previous_page:
                                type: string
                                readOnly: true
                                description: The previous page in the result set.
                              next_page:
                                type: string
                                readOnly: true
                                description: The next page in the result set.
              examples:
                Incidents:
                  value:
                    limit: 1
                    cursor_id: 1234l12345678
                    incidents:
                    - id: 1234l12345678
                      metric: conversion_value
                      type: partner
                      date: '2019-11-01'
                      time_window: 1
                      partner:
                        id: 1001l1111
                        name: PZ Finance
                      status: active
                      created_at: '2020-04-01T00:00:00.000Z'
                      deleted_at: '2020-04-01T00:00:00.000Z'
                    hypermedia:
                      pagination:
                        previous_page: v2/campaigns/111111/fraud/incidents?limit=1&cursor_id=1234l12345677
                        next_page: v2/campaigns/111111/fraud/incidents?limit=1&cursor_id=1234l12345679
        '400':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
              examples:
                Bad Status:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_status
                        message: No status with the name `status` was found
                      code: 400
                      message: Bad Request
                Bad Metric:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_metric
                        message: No metric with the name `metric` was found
                      code: 400
                      message: Bad Request
                Bad Metric Type:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_metric_type
                        message: No metric type of `metric_type` was found
                      code: 400
                      message: Bad Request
                Bad Request:
                  value:
                    error:
                      errors:
                      - type: error
                        code: invalid_params
                        message: If you specify a metric filter, you must also specify type
                      code: 400
                      message: Bad Request
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
              examples:
                Unauthorised:
                  value:
                    error:
                      errors:
                      - type: error
                        code: unauthorised
                        message: Feature 'fraud_detection' not enabled for this Network
                      code: 403
                      message: Forbidden
        '503':
          description: Fraud Service Unavailable
          content:
            application/json:
              examples:
                Fraud Service Unavailable:
                  value:
                    error:
                      errors:
                      - type: error
                        code: remote_service_unavailable
                        message: The remote service 'Fraud Detection' is currently unavailable
                      code: 503
                      message: Remote Service Unavailable
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
      description: Get all incidents that are not dismissed ordered by date descending
      operationId: get-incidents
  /v2/campaigns/{campaign_id}/fraud/incidents/{incident_id}:
