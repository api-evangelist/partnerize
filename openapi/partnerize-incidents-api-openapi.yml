  /v2/campaigns/{campaign_id}/fraud/incidents-aggregation:
    parameters:
    - name: campaign_id
      in: path
      description: Campaign ID
      required: true
      schema:
        type: string
    - name: start_date
      in: query
      description: Only include incidents after this date.
      required: true
      schema:
        type: string
        format: date
    - name: end_date
      in: query
      description: Only include incidents before this date.
      required: true
      schema:
        type: string
        format: date
    get:
      summary: Get Incidents Aggregation
      tags:
      - Incidents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GET Incidents Aggregation Response
                type: object
                description: This is the response to a GET incidents aggregation call on the PzAPI.
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - date_time_range
                      - volume_clicks
                      - volume_conversions
                      - conversion_ratio
                      - basket_variability_sku
                      - conversion_value
                      - ttc
                      properties:
                        date_time_range:
                          type: object
                          required:
                          - start
                          - end
                          properties:
                            start:
                              type: string
                            end:
                              type: string
                        volume_clicks:
                          type: integer
                        volume_conversions:
                          type: integer
                        conversion_ratio:
                          type: integer
                        basket_variability_sku:
                          type: integer
                        conversion_value:
                          type: integer
                        ttc:
                          type: integer
              examples:
                Incidents:
                  value:
                    data:
                    - date_time_range:
                        start: '2019-10-02T00:00:00.000Z'
                        end: '2019-10-03T00:00:00.000Z'
                      volume_clicks: 10
                      volume_conversions: 20
                      conversion_ratio: 15
                      basket_variability_sku: 25
                      conversion_value: 30
                      ttc: 35
                    - date_time_range:
                        start: '2019-10-03T00:00:00.000Z'
                        end: '2019-10-04T00:00:00.000Z'
                      volume_clicks: 11
                      volume_conversions: 21
                      conversion_ratio: 16
                      basket_variability_sku: 26
                      conversion_value: 31
                      ttc: 36
                    - date_time_range:
                        start: '2019-10-04T00:00:00.000Z'
                        end: '2019-10-05T00:00:00.000Z'
                      volume_clicks: 12
                      volume_conversions: 22
                      conversion_ratio: 17
                      basket_variability_sku: 27
                      conversion_value: 32
                      ttc: 37
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
              examples:
                Unauthorised:
                  value:
                    error:
                      errors:
                      - type: error
                        code: unauthorised
                        message: Feature 'fraud_detection' not enabled for this Network
                      code: 403
                      message: Forbidden
        '404':
          description: Entity Not Found
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
              examples:
                basic:
                  value:
                    error:
                      errors:
                      - type: error
                        code: entity_not_found
                        message: Incident not found for id 'string'
                      code: 404
                      message: Not Found
        '503':
          description: Fraud Service Unavailable
          content:
            application/json:
              examples:
                Fraud Service Unavailable:
                  value:
                    error:
                      errors:
                      - type: error
                        code: remote_service_unavailable
                        message: The remote service 'Fraud Detection' is currently unavailable
                      code: 503
                      message: Remote Service Unavailable
              schema:
                $ref: '#/paths/~1v2~1networks~1%7Bnetwork_id%7D~1publishers/get/responses/400/content/application~1json/schema'
      description: Get an aggregated total of incidents by day
      operationId: get-incidents-aggregation
  /v2/campaigns/{campaign_id}/fraud/incidents/{incident_id}/reject-partner:
