components:
  schemas:
    Publisher_Database:
      properties:
        database_id:
          description: ID of the partner database
          type: string
        publisher_id:
          description: ID of the partner the database belongs to
          type: string
        active:
          $ref: '#/components/schemas/YesOrNo'
        creation_method:
          type: string
        database_name:
          type: string
        female:
          type: number
        male:
          type: number
        max_age:
          type: number
        min_age:
          type: number
        size:
          type: number
      required:
      - database_name
      - creation_method
      - size
      type: object
    Status:
      type: string
      enum:
      - a
      - p
      - r
      - n
    Publisher_Website_Wrapper:
      properties:
        website:
          $ref: '#/components/schemas/Publisher_Website'
      type: object
    Publisher:
      type: object
      properties:
        websites:
          items:
            $ref: '#/components/schemas/Publisher_Website_Wrapper'
          type: array
        us_tax_state:
          type: string
        reporting_identifier:
          type: string
        publisher_id:
          description: ID of the partner
          type: string
        network_status:
          $ref: '#/components/schemas/Status'
        network_notes:
          type: string
        network_id:
          description: ID of the network this partner belongs to
          type: string
        legal_entity:
          $ref: '#/components/schemas/Country'
        is_affiliate_user:
          $ref: '#/components/schemas/YesOrNo'
        gst_registered:
          type: string
        foreign_identifier:
          type: string
        databases:
          items:
            $ref: '#/components/schemas/Publisher_Database_Wrapper'
          type: array
        campaign_select:
          type: string
        abn:
          type: string
        account_name:
          type: string
        company_division:
          type: string
        company_name:
          type: string
        contact_email:
          type: string
        contact_locale:
          $ref: '#/components/schemas/Locale'
        contact_name:
          type: string
        default_currency:
          $ref: '#/components/schemas/Currency'
        description:
          description: Description of the partner
          type: string
        im_provider:
          type: string
        im_username:
          type: string
        is_foreign_network:
          $ref: '#/components/schemas/YesOrNo'
          description: Reporting only flag. All conversions will be automatically approved but will not be invoiceable.
        is_lead_user:
          $ref: '#/components/schemas/YesOrNo'
        operating_country:
          $ref: '#/components/schemas/Country'
        promotional_method:
          type: number
        promotional_method_name:
          type: string
        promotional_countries:
          type: array
          items:
            type: object
            properties:
              iso:
