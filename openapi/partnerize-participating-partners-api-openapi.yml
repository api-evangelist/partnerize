openapi: 3.2.0
info:
  title: Partnerize Brands Attribution Participating Partners API
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
- description: Local
  url: http://api.partnerize.tech
tags:
- description: 'Before Partners can generate conversions for a Campaign, they must be approved to do so. A Partner can apply to

    be part of a Campaign, or the Brand can choose to add the Partner(s) of their choice to their own Campaign.

    Furthermore, if a Brand has stipulated their own unique set of Campaign Terms and Conditions, the Partner

    must explicitly agree to these if they are to be fully approved on the Campaign.'
  name: Participating Partners
paths:
  /campaign/{campaign_id}/publisher:
    get:
      parameters:
      - description: ID of the campaign
        example: 10l176
        in: path
        name: campaign_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    publishers:
                    - publisher:
                        abn: null
                        account_name: partner123
                        campaign_custom_terms_and_conditions_id: 10l176
                        campaign_custom_terms_and_conditions_title: Some fancy title
                        campaign_select: null
                        campaign_status: a
                        company_division: null
                        company_name: Demo Partner
                        contact_email: demo@partnerize.com
                        contact_locale: bg
                        contact_name: John Smith
                        databases:
                        - active: y
                          creation_method: Email
                          database_id: 111111l300347
                          database_name: Partnerize Database
                          female: 50
                          male: 50
                          max_age: 77
                          min_age: 25
                          publisher_id: 1l1007802
                          size: 53000
                        default_currency: GBP
                        description: null
                        foreign_identifier: null
