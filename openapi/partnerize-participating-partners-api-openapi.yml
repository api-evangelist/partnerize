                        network_status: a
                        operating_country: GB
                        phone: 01595725007
                        phone_area: '+44'
                        promotional_method: 10
                        promotional_method_name: Portal
                        publisher_id: 1l1007802
                        reporting_identifier: null
                        reporting_timezone: Australia/Sydney
                        signup_ip: 178.23.129.160
                        uk_vat_registered: y
                        us_tax_state: null
                        vat_number: 974997534
                        vertical: 10
                        vertical_name: Other
                        websites:
                        - active: y
                          primary: n
