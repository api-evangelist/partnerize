      description: 'Add new Campaign participations by passing each `publisher_id` along with the relevant `campaign_status` in an

        object within a `publishers` array.'
      operationId: update-partner-participation
      requestBody:
        content:
          application/json:
            schema:
              example:
                publishers:
                - campaign_status: a
                  publisher_id: 1l1007802
              properties:
                publishers:
                  items:
                    properties:
                      campaign_status:
                        $ref: '#/components/schemas/Status'
                      publisher_id:
                        type: string
                    required:
                    - campaign_status
                    - publisher_id
                  type: array
      summary: Update a Partner Participation on a Campaign
  /campaign/{campaign_id}/publisher/{publisher_id}:
    get:
