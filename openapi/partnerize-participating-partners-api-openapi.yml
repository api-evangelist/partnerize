              schema:
                properties:
                  publishers:
                    items:
                      $ref: '#/components/schemas/Publisher_Wrapper'
                    type: array
                type: object
          description: OK
      tags:
      - Participating Partners
      description: View all Partners Participating on the Campaign.
      operationId: List all Participating Partners
      summary: List all Participating Partners
