openapi: 3.2.0
info:
  title: Partnerize Partners Partner Conversions API
  version: 1.4.99
  description: '# Introduction


    This is the full external API documentation for the Partnerize API.'
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
servers:
- description: Production
  url: https://api.partnerize.com
tags:
- name: Partner Conversions
paths:
  /reporting/report_publisher/publisher/{publisher_id}/conversion.{format}:
    get:
      parameters:
      - description: ID of the partner
        example: 1l1007802
        in: path
        name: publisher_id
        required: true
        schema:
          type: string
      - description: Format for the response
        example: json
        in: path
        name: format
        required: true
        schema:
          enum:
          - json
          - xml
          type: string
      - description: Start date for data to be included in the report
        example: '2016-02-30T05:15:32Z'
        in: query
        name: start_date
        required: true
        schema:
          type: string
      - description: End date for data to be included in the report
        example: '2016-03-10T19:02:35Z'
        in: query
        name: end_date
        required: false
        schema:
          type: string
      - description: Restricts the results to one of the following - this hour, last hour, today, yesterday, this week, last week, last X days, this month, last month, this year, last year.
        example: yesterday
        in: query
        name: text_date
        required: false
        schema:
          type: string
      - description: Enforce a specified Timezone.
        example: Europe/London
        in: query
        name: timezone
        required: false
        schema:
          type: string
      - description: Filter the results by the specified currency
        example: USD
        in: query
        name: currency[]
        required: false
        schema:
          $ref: '#/components/schemas/Currency'
      - description: This parameter to run the report for conversions that have been updated. When you specify `last_updated` or `approved_at` the response will only include conversions that were last modified or approved at in approved_at a date within the report date range.
        example: last_modified
        in: query
        name: date_type
        required: false
        schema:
          type: string
      - description: 'Add a secondary pivot filter. You need to specify the pivot parameter name and the value to filter by. E.g. multipivot[campaign][]=111111l29. Supported values are: `campaign`, `product`, `publisher_reference`.'
        example: value
        in: query
        name: multipivot[{pivot}][]
        required: false
        schema:
          type: string
      - description: Filter by statuses. Available values - approved, pending, rejected
        example: approved
        in: query
        name: statuses[]
        required: false
        schema:
          type: string
      - description: Offset the results by a given amount. Defaults to 0.
        example: '0'
        in: query
        name: offset
        required: false
        schema:
          type: string
      - description: Invoices that were created after the supplied date.
        example: '2016-03-10T19:02:35Z'
        in: query
        name: invoice_created_date
        required: false
        schema:
          type: string
      - description: 'Include payment information. Omit parameter or false to exclude, which is the default. Fields included are:

          + payment_status

          + self_bill_request_date

          + self_bill_release_date'
        example: true
        in: query
        name: include_payment_info
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json; charset=utf-8:
              examples:
                response:
                  value:
                    total_conversion_count:
                      EUR: 1
                    total_publisher_commission:
                      EUR: 95.5
                    total_value:
                      EUR: 955
                    start_date_time_utc: '2019-08-10 00:00:00'
                    end_date_time_utc: '2020-03-10 00:00:00'
                    start_date_time: '2020-03-08 17:18:33'
                    end_date_time: '2020-03-08 17:18:33'
                    limit: 300
                    meta_data: []
                    count: 1
                    execution_time: 1.04266 seconds
                    conversions:
                    - conversion_data:
                        conversion_id: 111111l314
                        campaign_id: 111111l29
                        publisher_id: 111111l92
                        conversion_time: '2020-03-08 17:18:33'
                        creative_type: 0
