              schema:
                $ref: '#/components/schemas/Partner_Conversions'
          description: OK
      tags:
      - Partner Conversions
      description: Return a mix of aggregated and basket/item level conversion data for a partner.
      operationId: partner-conversions
      summary: Retrieve a Partner Conversions Report
