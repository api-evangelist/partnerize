components:
  schemas:
    Publishers_V2_Filters:
      account_created:
        name: account_created
        description: Date range for when partners signed up
        in: query
        schema:
          type: string
          example: 2020-01-01..2021-01-01
      campaign_ids:
        name: campaign_ids
        description: The publishers' campaign ids
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
      campaign_statuses:
        name: campaign_statuses
        description: The publishers' campaign statuses
        in: query
        schema:
          oneOf:
          - type: string
            enum:
            - approved
            - requested
            - invited
            - rejected
            - available
          - type: array
            items:
              $ref: '#/components/schemas/Publishers_V2_Filters/campaign_statuses/schema/oneOf/0'
      commission_group_ids:
        name: commission_group_ids
        description: The publishers' commission group ids
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
      company_name:
        name: company_name
        description: The publishers' company name
        in: query
        schema:
          type: string
      fields:
        name: fields
        description: CSV list of fields to be returned as part of the response
        in: query
        schema:
          type: string,
          enum:
          - account_created
          - address
          - campaigns
          - commission_groups
          - company_name
          - company_logo
          - contact_email
          - contact_name
          - default_currency
          - description
          - id
          - locale
          - metadata
          - name
          - operating_country
          - partner_collection_ids
          - phone_number
          - promotional_countries
          - promotional_method
          - reporting_identifier
          - vertical
          - websites
          - website_info
          - network_notes
          - network_id
          - signup_ip
      ids:
        name: ids
        description: Filter by partner IDs
        in: query
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      include_discovery:
        name: include_discovery
        description: Whether to include partners with pending requests from brand discovery or invites from partner discovery
        in: query
        schema:
          $schema: http://json-schema.org/draft-04/schema
          title: Boolean
          type: string
          enum:
          - y
          - n
      website_verified:
        name: website_verified
        description: Whether to filter partners by their primary website domain verification status
        in: query
        schema:
          type: boolean
          enum:
          - y
          - n
      limit:
        name: limit
        description: The number of records to retrieve
        in: query
        schema:
          type: integer
      locales:
        name: locales
        description: The publishers' contact locale (locale codes), see https://api.partnerize.com/reference/locale
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
      network_statuses:
        name: network_statuses
        description: The publishers' network status. Choosing requested or invited will automatically enable the include_discovery option for convenience.
        in: query
        schema:
          oneOf:
          - type: string
            enum:
            - approved
            - pending
            - rejected
            - invited
            - requested
          - type: array
            items:
              $ref: '#/components/schemas/Publishers_V2_Filters/network_statuses/schema/oneOf/0'
      offset:
        name: offset
        description: Starting position
        in: query
        schema:
          type: integer
      operating_countries:
        name: operating_countries
        description: The publishers' operating countries (country isos), see https://api.partnerize.com/reference/country
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
      partner_collection_id:
        name: partner_collection_id
        description: Filter by partner collection ID
        in: query
        schema:
          type: string
      promotional_countries:
        name: promotional_countries
        description: The publishers' promotional countries (country isos), see https://api.partnerize.com/reference/country
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
      promotional_method_ids:
        name: promotional_method_ids
        description: The publishers' promotional methods , see https://api.partnerize.com/reference/promotional_method
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
      publisher_email:
        name: publisher_email
        in: query
        schema:
          type: string
      publisher_name:
        name: publisher_name
        description: Search by the publishers' company name, falling back the publisher name
        in: query
        schema:
          type: string
      publisher_tag_ids:
        name: publisher_tag_ids
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
      publisher_website:
        name: publisher_website
        in: query
        schema:
          type: string
      reporting_identifier:
        name: reporting_identifier
        in: query
        schema:
          type: string
      search:
        name: search
        description: Search for matching publishers
        in: query
        schema:
          type: string
      sort:
        name: sort
        description: Order results
        in: query
        schema:
          type: string
        example: name
      vertical_ids:
        name: vertical_ids
        description: The publishers' verticals, see https://api.partnerize.com/reference/vertical
        in: query
        schema:
          $ref: '#/components/schemas/Publishers_V2_Filters/ids/schema'
