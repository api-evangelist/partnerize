            application/json:
              schema:
                title: Voucher List Response
                type: object
                description: Voucher List Object
                example:
                  count: '1'
                  execution_time: 0.30000 seconds
                  voucher_commissions:
                  - description: example
                    end_date: '2023-10-01 00:00:00'
                    group_limit:
                      id: 111111l1
                      name: example
                    id: 111111l1
                    last_modified: '2023-10-01 00:00:00'
                    last_modified_by: 111111l1
                    meta_fields:
                    - name: sku
                      value:
                      - '1'
                      weight: 1
                    performance_model: fixed_cpa
                    performance_value: 20
                    start_date: '2023-10-01 00:00:00'
                    status: SCHEDULED
                    voucher_codes:
                    - code: example-code
                      description: example
                      end_date: '2023-10-01 00:00:00'
                      id: 111111l1
                      start_date: '2023-10-01 00:00:00'
                      groups:
                      - id: 111111l1
                        name: example
                properties:
                  count:
                    type: integer
                  execution_time:
                    type: string
                  voucher_commissions:
                    type: array
                    items:
                      type: object
                      title: Voucher Commission
