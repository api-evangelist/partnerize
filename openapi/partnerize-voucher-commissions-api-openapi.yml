        '200':
          description: Save Voucher Commission
          content:
            application/json:
              schema:
                title: Voucher Commission
                type: object
                example:
                  execution_time: 0.30000 seconds
                  voucher_commission:
                    description: example
                    end_date: '2023-10-01 00:00:00'
                    group_limit:
                      id: 111111l1
                      name: example
                    id: 111111l1
                    last_modified: '2023-10-01 00:00:00'
                    last_modified_by: 111111l1
                    meta_fields:
                    - name: sku
                      value:
                      - '1'
                      weight: 1
                      rules:
                      - operator: EQUALS
                        value: '1'
                    performance_model: fixed_cpa
                    performance_value: 20
                    start_date: '2020-01-01 00:00:00'
                    status: SCHEDULED
                    voucher_codes:
                    - code: example-code
