openapi: 3.2.0
info:
  title: Partnerize Voucher Commissions API
  version: 1.4.99
  contact:
    email: support@partnerize.com
  x-logo:
    url: https://console.partnerize.com/assets/img/network/partnerize/logo.png
    altText: Partnerize
  description: 'Operations tagged Voucher Commissions across 2 of this provider''s published API definitions: partnerize-partners-api-openapi.yml, partnerize-voucher-commissions-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Production
  url: https://api.partnerize.com
- description: Local
  url: http://api.partnerize.tech
tags:
- name: Voucher Commissions
paths:
  /v2/campaigns/{campaignId}/publishers/{publisherId}/commissions/voucher:
    get:
      operationId: get-publisher-commissions-voucher
      tags:
      - Voucher Commissions
      summary: List Partner Voucher Commissions For Specific Campaign
      description: This endpoint lists partner voucher commissions for the given partner and campaign.
      parameters:
      - in: path
        name: publisherId
        description: The ID of the partner to list commissions for
        required: true
        schema:
          type: string
      - in: path
        name: campaignId
        description: The ID of the campaign to list the partner commissions for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Partner Voucher Commissions List
          content:
            application/json:
              schema:
                type: object
                properties:
                  voucher_commissions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        description:
                          type: string
                        performance_value:
                          type: number
                          description: The amount to be paid to the partner for commission. Must be greater than 0. Will be rounded to 2 decimal places.
                          minimum: 0.01
                        performance_model:
                          type: string
                          description: The performance model by which the partner is rewarded.
                          enum:
                          - cpc
                          - fixed_cpa
                          - percentage_cpa
                        start_date:
                          allOf:
                          - $ref: '#/paths/~1v2~1campaigns~1%7BcampaignId%7D~1publishers~1%7BpublisherId%7D~1commissions~1default/get/responses/200/content/application~1json/schema/properties/last_modified'
                        end_date:
                          allOf:
                          - $ref: '#/paths/~1v2~1campaigns~1%7BcampaignId%7D~1publishers~1%7BpublisherId%7D~1commissions~1default/get/responses/200/content/application~1json/schema/properties/last_modified'
                        status:
                          $ref: '#/paths/~1v2~1campaigns~1%7BcampaignId%7D~1publishers~1%7BpublisherId%7D~1commissions~1campaign/get/responses/200/content/application~1json/schema/properties/commissions/items/properties/status'
                        meta_fields:
                          type: array
                          minItems: 0
                          items:
                            type: object
                            title: Meta Field Value
                            description: Meta Field with an assigned value
                            allOf:
                            - type: object
                              title: Meta Field
                              properties:
                                name:
                                  type: string
                                  description: The name of the meta field
                                  example: category
                              required:
                              - name
                            - properties:
                                value:
                                  description: The value of meta field to look for
                              required:
                              - value
                        last_modified:
                          allOf:
                          - $ref: '#/paths/~1v2~1campaigns~1%7BcampaignId%7D~1publishers~1%7BpublisherId%7D~1commissions~1default/get/responses/200/content/application~1json/schema/properties/last_modified'
                        last_modified_by:
                          type: string
                          description: ID of the most recent user to modify this record.
                        voucher_codes:
                          type: array
                          minItems: 0
                          description: Voucher code details associated with this voucher commission
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              code:
                                type: string
                              description:
                                type: string
                              start_date:
                                type: string
                              end_date:
                                type: string
                              groups:
                                type: array
                                minItems: 0
                                items:
                                  $ref: '#/paths/~1v2~1campaigns~1%7BcampaignId%7D~1publishers~1%7BpublisherId%7D~1commissions~1tier/get/responses/200/content/application~1json/schema/properties/tiers/items/properties/groups/items'
