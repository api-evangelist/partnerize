      operationId: post-voucher-commission
      tags:
      - Voucher Commissions
      summary: Create Voucher Commission
      description: This endpoint saves a given Voucher Commission
      parameters:
      - in: path
        name: campaignId
        description: The ID of the campaign the voucher commission belongs to
