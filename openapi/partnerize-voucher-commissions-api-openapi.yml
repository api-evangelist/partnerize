                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              value:
                                type:
                                - string
                                - integer
                              weight:
                                type: integer
                              rules:
                                type: array
                                items:
                                  type: object
                                  $ref: '#/paths/~1v2~1campaigns~1%7BcampaignId%7D~1commissions~1%7BcommissionId%7D~1retire/post/responses/200/content/application~1json/schema/properties/meta_fields/items/allOf/1/properties/rules/items'
                        performance_model:
                          type: string
                        performance_value:
                          type: number
                        start_date:
                          type: string
                          format: date-time
                        status:
                          type: string
                        voucher_codes:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                              description:
                                type:
                                - string
                                - 'null'
                              end_date:
                                type:
                                - string
                                - 'null'
                                format: date-time
                              id:
                                type: string
                              start_date:
                                type: string
                                format: date-time
                              groups:
                                type:
                                - array
                                - 'null'
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    name:
                                      type: string
