notes:
  - >-
    There is no first-party client library for the Partnerize Brands API or Partners API
    in any language. Consumers of the 327 REST operations catalogued in openapi/ build
    their own HTTP client against HTTP Basic authentication.
  - >-
    The mobile SDKs are current: iOS 3.0.2 (2026-06-22) and Android 3.0.2 (2026-06-15)
    both shipped within two months of this pass, against an API documented at version
    1.4.99. The decay signal in this repo is not the mobile line, it is the CocoaPods pod
    (2.1.3, 2024) and the legacy com.partnerize.android:tracking coordinate (1.6, 2022),
    both of which remain resolvable and will silently keep old integrations on 2.x.
  - >-
    PerformanceHorizonGroup also hosts an apidocs repository (API Blueprint, last pushed
    2021-05-07) which predates the current Redoc-published OpenAPI at
    api-docs.partnerize.com and is not a package.
