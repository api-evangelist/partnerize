name: Partnerize Packages and SDKs
description: >-
  First-party Partnerize client libraries. Partnerize publishes no server-side REST SDK
  for the Brands or Partners API in any general-purpose registry — npm, PyPI, RubyGems,
  Packagist and crates.io were all probed for partnerize / partnerize-sdk / partnerize-api
  and every lookup returned 404. What Partnerize does ship, and ships actively, is a pair
  of mobile conversion-tracking SDKs (iOS and Android) plus a Salesforce Commerce Cloud
  cartridge, all from the PerformanceHorizonGroup GitHub organisation.
